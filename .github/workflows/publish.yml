name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for traceability)"
        required: true
        type: string
      dry_run:
        description: "Run the publish flow without publishing to npm"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    concurrency:
      group: npm-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Coverage guard
        run: pnpm verify:coverage

      - name: Build
        run: pnpm build

      - name: Operational smoke
        run: pnpm verify:smoke

      - name: Verify release
        run: pnpm verify:release

      - name: Verify compatibility inventory
        run: pnpm verify:compat

      - name: Verify type debt
        run: pnpm verify:test-type-debt

      - name: Publish packages
        run: bash scripts/release/publish-packages.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
