name: overnight-builder
version: "2.0"
description: "TDD 기반 기획→설계→테스트작성→구현→리뷰→커밋 cycle을 반복하는 overnight workflow"

steps:
  - name: refine_idea
    agent: planner
    tools: [file_read, file_write, file_list]
    config:
      repair_loop:
        enabled: true
        validation_step: review_and_decide
        max_no_progress_iterations: 2
      maxToolRounds: 64
    input:
      task: |
        당신은 기획자입니다. 매 cycle마다 프로젝트를 한 단계 더 발전시킵니다.

        아래 파일을 읽으세요:
        - input/idea.md
        - input/constraints.md (있으면)

        이전 cycle이 있다면 아래도 읽으세요:
        - artifacts/cycle-log.md (있으면)
        - workspace/ 안의 현재 코드 상태

        artifacts/01-refined-idea.md를 작성하세요:
        1. 프로젝트 개요
        2. 이번 cycle에서 추가/개선할 기능 (1~2개만)
        3. 완료 기준 (이번 cycle의 done 조건)
        4. MVP 전체 진행률 추정

        규칙:
        - 첫 cycle이면 MVP 전체를 기획하되, 이번에 만들 범위는 작게 잡으세요.
        - 이후 cycle이면 이전 cycle 결과를 보고 다음으로 할 일을 정하세요.
        - 한 cycle에 너무 많이 하려 하지 마세요. 작은 단위로 쪼개세요.

  - name: design_and_write_tests
    agent: architect
    depends_on: [refine_idea]
    tools: [file_read, file_write, file_list]
    input:
      task: |
        당신은 TDD 기반 설계자입니다. 테스트를 먼저 작성합니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - input/constraints.md (있으면)
        - workspace/ 안의 현재 코드 (있으면)

        이번 cycle에서 할 일:
        1. artifacts/02-system-design.md 작성:
           - 이번 cycle의 설계 (파일 구조, 모듈, 인터페이스)
           - 테스트 전략
        2. workspace/ 안에 테스트 파일을 먼저 작성:
           - 이번 cycle의 기능에 대한 테스트
           - 아직 구현이 없으므로 테스트는 실패해야 정상
        3. workspace/package.json이 없으면 만드세요 (test script 포함)

        규칙:
        - TDD: 테스트를 먼저 쓰고, 구현은 다음 step에서 합니다.
        - 테스트는 실행 가능해야 합니다.
        - 이전 cycle의 테스트는 유지하세요. 새 테스트만 추가하세요.

  - name: implement_or_repair
    agent: implementer
    depends_on: [design_and_write_tests]
    tools: [file_read, file_write, file_list]
    config:
      repair_loop:
        enabled: true
        validation_step: run_tests_and_judge
        max_no_progress_iterations: 3
        repeated_critical_issue_ceiling: 3
      maxToolRounds: 256
    input:
      task: |
        당신은 구현자입니다. 테스트를 통과시키는 것이 목표입니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - artifacts/02-system-design.md
        - workspace/ 안의 테스트 파일

        repair 시도인 경우, 이전 test 결과를 읽고 실패한 부분만 수정하세요.

        규칙:
        - TDD: 테스트가 이미 있습니다. 그 테스트를 통과시키세요.
        - 테스트를 수정하지 마세요. 구현만 수정하세요.
        - workspace/ 안에서만 작업하세요.
        - 최소한의 코드로 테스트를 통과시키세요.

        구현 후 artifacts/03-implementation-notes.md를 작성하세요:
        1. 생성/수정한 파일
        2. 핵심 구현 결정
        3. 남은 리스크

  - name: run_tests_and_judge
    agent: validator
    depends_on: [implement_or_repair]
    tools: [file_read, file_write, file_list]
    config:
      validation:
        enabled: true
        emit_structured_result: true
      maxToolRounds: 64
    on_fail:
      goto: implement_or_repair
      max_iterations: 8
      escalate_on_exhaust: fail
    input:
      task: |
        당신은 테스트 검증자입니다.

        workspace/ 안에서 테스트를 실행하세요:
        1. workspace/package.json의 test script 확인
        2. 테스트 파일이 존재하는지 확인
        3. 핵심 구현 파일이 존재하는지 확인
        4. 코드 구조가 설계와 일치하는지 확인

        artifacts/04-test-report.md를 작성하세요.

        최종 응답은 반드시 아래 JSON만 반환하세요:
        {
          "passed": boolean,
          "summary": "string",
          "failedChecks": [{ "name": "string", "message": "string" }],
          "signature": "stable-signature"
        }

  - name: review_and_decide
    agent: reviewer
    depends_on: [run_tests_and_judge]
    tools: [file_read, file_write, file_list]
    config:
      validation:
        enabled: true
        emit_structured_result: true
      maxToolRounds: 64
    on_fail:
      goto: refine_idea
      max_iterations: 20
      escalate_on_exhaust: fail
    input:
      task: |
        당신은 리뷰어이자 cycle controller입니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - artifacts/03-implementation-notes.md
        - artifacts/04-test-report.md
        - workspace/ 안의 코드

        할 일:
        1. 코드 품질 리뷰
        2. 필요하면 workspace/ 코드를 직접 개선 (리팩터링, 문서화)
        3. artifacts/05-review-notes.md 작성
        4. artifacts/cycle-log.md에 이번 cycle 결과를 append
           (cycle 번호, 추가한 기능, 테스트 수, 상태)

        그리고 판단하세요:
        - MVP가 아직 미완성이고 더 만들 기능이 있으면 → FAIL (다음 cycle로)
        - MVP가 충분히 완성됐으면 → PASS (archive로)

        최종 응답은 반드시 아래 JSON만 반환하세요:
        {
          "passed": boolean,
          "summary": "string",
          "failedChecks": [{ "name": "string", "message": "string" }],
          "signature": "stable-signature"
        }

        FAIL일 때 failedChecks에는 다음 cycle에서 할 일을 적으세요.

  - name: archive_overnight
    agent: archivist
    depends_on: [review_and_decide]
    tools: [file_read, file_write, file_list]
    input:
      task: |
        당신은 아키비스트입니다. 전체 overnight build를 마무리합니다.

        아래 파일을 모두 읽으세요:
        - artifacts/01-refined-idea.md
        - artifacts/02-system-design.md
        - artifacts/03-implementation-notes.md
        - artifacts/04-test-report.md
        - artifacts/05-review-notes.md
        - artifacts/cycle-log.md

        artifacts/06-archive-summary.md를 작성하세요:
        1. 프로젝트 최종 요약
        2. cycle별 진행 기록
        3. 최종 테스트 결과
        4. 코드 품질 평가
        5. 재사용 가능한 교훈
        6. 다음 단계 제안
