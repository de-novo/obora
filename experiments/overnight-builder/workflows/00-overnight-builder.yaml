name: overnight-builder
version: "4.0"
description: "TDD 기반 프로덕션 수준 기획→설계→테스트→구현→실제빌드/린트/테스트실행→리뷰 cycle 반복"

hooks:
  pre_step:
    shell: "mkdir -p artifacts workspace"

steps:
  - name: refine_idea
    agent: planner
    tools: [file_read, file_write, file_list]
    config:
      repair_loop:
        enabled: true
        validation_step: review_and_decide
        max_no_progress_iterations: 2
      maxToolRounds: 64
    input:
      task: |
        당신은 시니어 프로덕트 매니저입니다. 프로덕션 수준의 소프트웨어를 만들기 위해 기획합니다.

        아래 파일을 읽으세요:
        - input/idea.md
        - input/constraints.md (있으면)

        이전 cycle이 있다면 아래도 읽으세요:
        - artifacts/cycle-log.md (있으면)
        - workspace/ 안의 현재 코드 상태

        artifacts/01-refined-idea.md를 작성하세요:
        1. 프로젝트 개요
        2. 이번 cycle에서 추가/개선할 기능 (1~2개)
        3. 프로덕션 품질 기준 (에러 핸들링, 엣지 케이스, UX)
        4. 완료 기준
        5. 전체 프로젝트 진행률 추정

        규칙:
        - 실제 배포 가능한 수준을 목표로 하세요.
        - 한 cycle에 1~2개 기능만 집중하되 프로덕션 완성도로 만드세요.

  - name: design_and_write_tests
    agent: architect
    depends_on: [refine_idea]
    tools: [file_read, file_write, file_list]
    skills: [quality-guidelines]
    input:
      task: |
        당신은 시니어 아키텍트이자 TDD 전문가입니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - input/constraints.md (있으면)
        - workspace/ 안의 현재 코드 (있으면)

        이번 cycle에서 할 일:
        1. artifacts/02-system-design.md 작성 (설계, 인터페이스, 에러 전략, 테스트 전략)
        2. workspace/ 안에 테스트 파일을 먼저 작성 (정상 + 에러 + 엣지)
        3. workspace/package.json이 없으면 만드세요. 반드시 아래 scripts 포함:
           - "build": "tsc"
           - "typecheck": "tsc --noEmit"
           - "lint": "eslint src test --ext .ts"
           - "test": "vitest run"
        4. workspace/tsconfig.json이 없으면 strict mode로 만드세요.

        규칙:
        - TDD: 테스트를 먼저 쓰고, 구현은 다음 step에서 합니다.
        - 이전 cycle의 테스트는 유지하세요.

  - name: implement_or_repair
    agent: implementer
    depends_on: [design_and_write_tests]
    tools: [file_read, file_write, file_list, shell_exec]
    skills: [quality-guidelines]
    hooks:
      pre_step:
        shell: "bash -lc 'cd workspace && if [ ! -d node_modules ]; then npm install --silent; fi'"
    config:
      repair_loop:
        enabled: true
        validation_step: run_tests_and_judge
        max_no_progress_iterations: 6
        repeated_critical_issue_ceiling: 6
      maxToolRounds: 256
    input:
      task: |
        당신은 시니어 개발자입니다. 테스트를 통과시키는 것이 목표입니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - artifacts/02-system-design.md
        - workspace/ 안의 테스트 파일

        repair 시도인 경우:
        - artifacts/04-test-report.md를 읽고 실패 원인을 파악하세요.
        - 빌드 에러, 타입 에러, 린트 에러, 테스트 실패 각각에 맞게 수정하세요.

        규칙:
        - 기본적으로 구현 코드를 수정하세요.
        - 단, validator가 "테스트 코드 버그"라고 명시적으로 판정한 경우에 한해 테스트도 수정할 수 있습니다.
        - 테스트 수정 시에는 테스트의 의도(검증 목적)를 유지하면서 구현과 일치하도록 고치세요.
        - workspace/ 안에서만 작업하세요.
        - 프로덕션 수준: 에러 처리, 입력 검증, 타입, JSDoc, console.log 금지

        구현 후 artifacts/03-implementation-notes.md를 작성하세요:
        1. 생성/수정한 파일
        2. 핵심 구현 결정
        3. 에러 핸들링 전략
        4. 남은 리스크

  - name: run_tests_and_judge
    agent: validator
    depends_on: [implement_or_repair]
    tools: [file_read, file_write, file_list, shell_exec]
    hooks:
      pre_validation:
        shell: >-
          bash -lc 'mkdir -p artifacts &&
          cd workspace &&
          if [ ! -d node_modules ]; then npm install --silent > ../artifacts/install.log 2>&1; else printf "npm install skipped\n" > ../artifacts/install.log; fi;
          npx tsc > ../artifacts/build.log 2>&1; BUILD=$?;
          npx tsc --noEmit > ../artifacts/typecheck.log 2>&1; TS=$?;
          if [ -d src ]; then npx eslint src > ../artifacts/lint.log 2>&1; LINT=$?; else printf "lint skipped\n" > ../artifacts/lint.log; LINT=$?; fi;
          npm test > ../artifacts/test.log 2>&1; TEST=$?;
          printf "build_exit_code=%s\ntypecheck_exit_code=%s\nlint_exit_code=%s\ntest_exit_code=%s\n" "$BUILD" "$TS" "$LINT" "$TEST" > ../artifacts/command-status.env;
          exit 0'
    config:
      validation:
        enabled: true
        emit_structured_result: true
      maxToolRounds: 64
    on_fail:
      goto:
        - when: 'failedChecks.some(c => c.name.includes("test_code_bug"))'
          target: design_and_write_tests
        - when: 'failedChecks.some(c => c.name.includes("design_issue"))'
          target: refine_idea
        - target: implement_or_repair
      max_iterations: 10
      escalate_on_exhaust: fail
    input:
      task: |
        당신은 QA 엔지니어입니다. 프로덕션 배포 전 실제 검증을 합니다.

        pre_validation hook이 아래 파일을 생성합니다. 이 파일들을 읽고 판정하세요:
        - artifacts/install.log
        - artifacts/typecheck.log
        - artifacts/lint.log
        - artifacts/test.log
        - artifacts/command-status.env

        각 명령어의 exit code와 출력을 확인해 판정하세요.

        artifacts/04-test-report.md를 작성하세요:
        1. TypeScript 타입 체크 결과 (PASS/FAIL + 에러 목록)
        2. 린트 결과 (PASS/FAIL/SKIP + 에러 목록)
        3. 테스트 결과 (PASS/FAIL + 실패한 테스트 목록)
        4. 종합 판정

        판정 기준:
        - TypeScript 타입 체크가 실패하면 → FAIL
        - 테스트가 실패하면 → FAIL
        - 린트는 warning만 있으면 PASS 가능, error가 있으면 FAIL
        - 모두 통과해야 PASS

        실패 원인 분류 (failedChecks의 name에 반드시 포함):
        - "test_code_bug": 테스트 코드 자체가 잘못된 경우 (잘못된 assertion, 오타, 논리 오류)
        - "design_issue": 설계/아키텍처 문제로 구현 불가능한 경우
        - "implementation_bug": 구현 코드의 버그 (기본값)

        최종 응답은 반드시 아래 JSON만 반환하세요:
        {
          "passed": boolean,
          "summary": "string",
          "failedChecks": [{ "name": "string", "message": "string" }],
          "signature": "stable-signature",
          "suggestedTargets": ["optional_step_name"]
        }

  - name: review_and_decide
    agent: reviewer
    depends_on: [run_tests_and_judge]
    tools: [file_read, file_write, file_list]
    config:
      validation:
        enabled: true
        emit_structured_result: true
      maxToolRounds: 128
    on_fail:
      goto: refine_idea
      max_iterations: 30
      escalate_on_exhaust: fail
    input:
      task: |
        당신은 테크 리드이자 cycle controller입니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - artifacts/02-system-design.md
        - artifacts/03-implementation-notes.md
        - artifacts/04-test-report.md
        - workspace/ 안의 코드

        프로덕션 리뷰 체크리스트:
        1. 빌드/타입체크/린트/테스트가 모두 통과했는가 (04-test-report.md 확인)
        2. 코드 품질 (책임 분리, 에러 핸들링, 입력 검증, 타입, 네이밍)
        3. 테스트 품질 (happy + error + edge)
        4. 문서화 (README, 코드 주석)
        5. 운영 준비 (하드코딩 없음, 로깅 적절)

        할 일:
        1. 리뷰
        2. 필요하면 workspace/ 코드 직접 개선
        3. artifacts/05-review-notes.md 작성
        4. artifacts/cycle-log.md에 이번 cycle 결과 append

        판단:
        - 아직 기능이 남았거나 품질 미달 → FAIL
        - 모든 기능 프로덕션 완성 → PASS

        최종 응답은 반드시 아래 JSON만 반환하세요:
        {
          "passed": boolean,
          "summary": "string",
          "failedChecks": [{ "name": "string", "message": "string" }],
          "signature": "stable-signature"
        }

  - name: archive_overnight
    agent: archivist
    depends_on: [review_and_decide]
    tools: [file_read, file_write, file_list]
    input:
      task: |
        당신은 아키비스트입니다.

        아래 파일을 모두 읽으세요:
        - artifacts/01-refined-idea.md ~ 05-review-notes.md
        - artifacts/cycle-log.md

        artifacts/06-archive-summary.md를 작성하세요:
        1. 프로젝트 최종 요약
        2. cycle별 진행 기록
        3. 빌드/타입체크/린트/테스트 최종 결과
        4. 프로덕션 품질 달성 근거
        5. 알려진 제한사항
        6. 배포/운영 가이드
        7. 다음 단계 제안

  - name: strategic_recommendations
    agent: reviewer
    depends_on: [archive_overnight]
    tools: [file_read, file_write, file_list]
    input:
      task: |
        당신은 시니어 CTO이자 프로덕트 전략가입니다.
        완성된 프로젝트를 분석하고, 앞으로의 발전 전략을 수립합니다.

        아래 파일을 모두 읽으세요:
        - artifacts/06-archive-summary.md
        - artifacts/01-refined-idea.md
        - artifacts/02-system-design.md
        - artifacts/cycle-log.md
        - workspace/README.md (있으면)
        - workspace/package.json
        - workspace/src/ 전체 구조

        artifacts/07-strategic-recommendations.md를 작성하세요:

        ## 1. 현재 프로젝트 성숙도 평가
        - 기능 완성도 (현재 구현된 것 vs 가능한 확장)
        - 코드 품질 수준 (아키텍처, 테스트 커버리지, 에러 핸들링)
        - 프로덕션 준비 상태

        ## 2. 단기 개선 (1~2 cycle, 즉시 가치)
        - 가장 적은 노력으로 가장 큰 사용자 가치를 만드는 작업 3~5개
        - 각 작업의 예상 난이도 (S/M/L)
        - 우선순위와 근거

        ## 3. 중기 확장 (3~5 cycle, 제품 차별화)
        - 경쟁력을 만드는 핵심 기능 3~5개
        - 기술적 의존성과 선행 작업
        - 각 기능이 열어주는 가능성

        ## 4. 장기 비전 (6+ cycle, 생태계/플랫폼)
        - 이 프로젝트가 궁극적으로 될 수 있는 것
        - 플랫폼/생태계 가능성
        - 통합/연동 기회

        ## 5. 기술 부채 & 리팩터링 로드맵
        - 현재 발견된 기술 부채
        - 방치 시 리스크
        - 언제 어떤 순서로 해결할지

        ## 6. 다음 overnight-builder cycle 추천
        - 다음 cycle에서 정확히 무엇을 만들면 좋을지
        - input/idea.md에 넣을 수 있는 형태로 구체적으로 작성
        - 기대 결과물과 완료 기준

        규칙:
        - 추상적 조언이 아니라 실행 가능한 구체적 제안을 하세요.
        - 각 제안에 "왜 지금 이것인가"의 근거를 포함하세요.
        - 현재 코드를 실제로 읽고 분석한 뒤 작성하세요.
        - 기술적 현실성을 고려하세요 (현재 스택, 의존성, 아키텍처 제약).

  - name: product_vision
    agent: planner
    depends_on: [strategic_recommendations]
    tools: [file_read, file_write, file_list]
    input:
      task: |
        당신은 시니어 프로덕트 매니저이자 UX 전략가입니다.
        완성된 프로젝트의 기능 기획 방향성을 수립합니다.

        아래 파일을 모두 읽으세요:
        - artifacts/07-strategic-recommendations.md
        - artifacts/06-archive-summary.md
        - artifacts/01-refined-idea.md
        - workspace/README.md (있으면)
        - workspace/package.json
        - workspace/src/ 전체 구조 (명령어, 서비스, 타입 등)

        artifacts/08-product-vision.md를 작성하세요:

        ## 1. 현재 사용자 경험 분석
        - 현재 제공하는 핵심 가치
        - 사용자 여정 (설치 → 첫 사용 → 일상 사용 → 고급 사용)
        - 현재 UX의 강점과 약점

        ## 2. 타겟 사용자 페르소나
        - 주요 사용자 유형 2~3개 정의
        - 각 페르소나의 핵심 니즈
        - 현재 제품이 어떤 페르소나를 잘 만족시키고, 어디가 부족한지

        ## 3. 기능 로드맵
        ### Phase 1: 핵심 경험 완성 (Must-have)
        - 없으면 사용자가 떠나는 기능
        - 각 기능의 사용자 스토리 (As a ..., I want ..., so that ...)
        - 예상 구현 복잡도

        ### Phase 2: 차별화 기능 (Nice-to-have)
        - 경쟁 제품 대비 차별점을 만드는 기능
        - 사용자가 "이거 때문에 쓴다"고 말할 기능
        - 기술적 의존성

        ### Phase 3: 생태계 확장 (Growth)
        - 플러그인/확장 시스템
        - 다른 도구와의 연동
        - 커뮤니티/공유 기능

        ## 4. 경쟁 분석
        - 같은 문제를 푸는 기존 도구/제품 3~5개
        - 각각의 강점과 약점
        - 우리 제품이 가져야 할 포지셔닝

        ## 5. 사용자 획득 전략
        - 초기 사용자를 어떻게 모을 것인가
        - 배포 채널 (npm, homebrew, GitHub releases 등)
        - 문서화/온보딩 전략

        ## 6. 다음 cycle 기능 기획서
        - 다음 cycle에서 만들 기능의 상세 기획
        - 사용자 스토리
        - 수용 기준 (Acceptance Criteria)
        - 와이어프레임/CLI 인터페이스 예시
        - input/idea.md에 바로 넣을 수 있는 형태로 작성

        규칙:
        - 기술 관점이 아니라 사용자/프로덕트 관점에서 생각하세요.
        - "좋겠다"가 아니라 "왜 이 기능이 지금 필요한가"를 설명하세요.
        - 현재 코드를 실제로 읽고 현실적인 제안을 하세요.
        - 실제 사용 시나리오 기반으로 작성하세요.
