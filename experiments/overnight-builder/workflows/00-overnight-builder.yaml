name: overnight-builder
version: "1.0"
description: "기획 고도화부터 코드 구현/테스트/리뷰까지 자율적으로 도는 overnight workflow"

steps:
  - name: refine_idea
    agent: planner
    tools: [file_read, file_write]
    input:
      task: |
        당신은 아이디어를 실행 가능한 기획으로 고도화하는 기획자입니다.

        아래 파일을 읽으세요:
        - input/idea.md
        - input/constraints.md (있으면)

        그리고 artifacts/01-refined-idea.md를 작성하세요.

        필수 섹션:
        1. 프로젝트 개요
        2. 핵심 기능 목록 (우선순위 포함)
        3. 사용자 시나리오
        4. 기술 요구사항
        5. 성공 기준
        6. MVP 범위 (하루 안에 만들 수 있는 최소 범위)

        규칙:
        - 하루 안에 한 명의 에이전트가 구현 가능한 범위로 좁혀야 합니다.
        - 막연한 기획이 아니라, 바로 설계로 넘길 수 있는 수준이어야 합니다.
        - 기술 스택은 constraints에 명시된 게 없으면 Node.js/TypeScript를 기본으로 합니다.

  - name: design_system
    agent: architect
    depends_on: [refine_idea]
    tools: [file_read, file_write]
    input:
      task: |
        당신은 시스템 설계자입니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - input/constraints.md (있으면)

        그리고 artifacts/02-system-design.md를 작성하세요.

        필수 섹션:
        1. 시스템 아키텍처
        2. 파일/디렉터리 구조
        3. 핵심 모듈 설명
        4. 데이터 흐름
        5. 테스트 전략
        6. 구현 순서 (어떤 파일을 먼저 만들지)

        규칙:
        - workspace/ 디렉터리 안에 프로젝트를 만들도록 설계하세요.
        - 테스트는 최소 1개 이상 포함하세요.
        - 외부 서비스 의존성은 최소화하세요.

  - name: implement_or_repair
    agent: implementer
    depends_on: [design_system]
    tools: [file_read, file_write, file_list]
    config:
      repair_loop:
        enabled: true
        validation_step: run_tests_and_judge
        max_no_progress_iterations: 3
        repeated_critical_issue_ceiling: 3
      maxToolRounds: 256
    input:
      task: |
        당신은 구현자입니다. 설계를 바탕으로 실제 코드를 작성합니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - artifacts/02-system-design.md

        repair 시도인 경우, 이전 validation 결과도 읽고 실패한 부분만 수정하세요.

        규칙:
        - workspace/ 디렉터리 안에 프로젝트 파일을 생성/수정하세요.
        - 설계 문서의 파일 구조를 따르세요.
        - 테스트 파일도 함께 만드세요.
        - package.json이 필요하면 만드세요.
        - 외부 패키지 설치가 필요하면 package.json에 명시하세요.

        구현 후 artifacts/03-implementation-notes.md를 작성하세요:
        1. 생성한 파일 목록
        2. 핵심 구현 결정
        3. 남은 리스크

  - name: run_tests_and_judge
    agent: validator
    depends_on: [implement_or_repair]
    tools: [file_read, file_write, file_list]
    config:
      validation:
        enabled: true
        emit_structured_result: true
      maxToolRounds: 64
    on_fail:
      goto: implement_or_repair
      max_iterations: 8
      escalate_on_exhaust: fail
    input:
      task: |
        당신은 테스트/검증 담당입니다.

        아래 파일을 읽으세요:
        - artifacts/02-system-design.md
        - artifacts/03-implementation-notes.md

        workspace/ 안의 코드를 검증하세요:
        1. 파일 구조가 설계와 일치하는지 확인
        2. 핵심 파일이 존재하는지 확인
        3. 코드가 문법적으로 올바른지 확인
        4. 테스트 파일이 있는지 확인
        5. README가 있는지 확인

        artifacts/04-test-report.md를 작성하세요.

        최종 응답은 반드시 아래 JSON만 반환하세요:
        {
          "passed": boolean,
          "summary": "string",
          "failedChecks": [{ "name": "string", "message": "string" }],
          "signature": "stable-signature"
        }

  - name: review_and_polish
    agent: reviewer
    depends_on: [run_tests_and_judge]
    tools: [file_read, file_write]
    input:
      task: |
        당신은 코드 리뷰어입니다.

        아래 파일을 읽으세요:
        - artifacts/01-refined-idea.md
        - artifacts/02-system-design.md
        - artifacts/03-implementation-notes.md
        - artifacts/04-test-report.md

        그리고 workspace/ 안의 코드를 리뷰하세요.

        artifacts/05-review-notes.md를 작성하세요:
        1. 코드 품질 평가
        2. 개선 포인트
        3. 추가 테스트 제안
        4. 문서화 상태
        5. 최종 판정

        필요하면 workspace/ 안의 파일을 직접 개선하세요.

  - name: archive_overnight
    agent: archivist
    depends_on: [review_and_polish]
    tools: [file_read, file_write]
    input:
      task: |
        당신은 아키비스트입니다. 전체 overnight build 과정을 요약합니다.

        아래 파일을 모두 읽으세요:
        - artifacts/01-refined-idea.md
        - artifacts/02-system-design.md
        - artifacts/03-implementation-notes.md
        - artifacts/04-test-report.md
        - artifacts/05-review-notes.md

        artifacts/06-archive-summary.md를 작성하세요:
        1. 프로젝트 요약
        2. 기획 → 설계 → 구현 → 테스트 → 리뷰 흐름 요약
        3. 최종 결과
        4. 재사용 가능한 교훈
        5. 다음 단계 제안
