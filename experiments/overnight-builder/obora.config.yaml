version: "1.0"
workflows: ./workflows
policies: .

persistence:
  enabled: true
  adapter: sqlite
  sqlite:
    path: ./data/obora.db

artifacts:
  enabled: true
  store: local
  local:
    basePath: ./data/artifacts

defaults:
  provider: zai
  model: glm-5
  temperature: 0.2
  timeout: 900
  maxTokens: 16384

providers:
  zai:
    authMode: global
    authRef: global:zai
    defaultModel: glm-5
    timeout: 900
    maxTokens: 16384
