version: "1.0"
workflows: ./workflows
policies: .

persistence:
  enabled: true
  adapter: sqlite
  sqlite:
    path: ./data/obora.db

artifacts:
  enabled: true
  store: local
  local:
    basePath: ./data/artifacts

sharedMemory:
  enabled: true
  adapter: file
  file:
    basePath: /Users/denovo/workspace/github/obora-kit/experiments/overnight-builder/data/.obora/shared-memory
    projectKey: overnight-builder
    scopes: [project, workflow]

tkgProjection:
  enabled: true
  adapter: file
  file:
    basePath: /Users/denovo/workspace/github/obora-kit/experiments/overnight-builder/data/.obora/tkg-staging
    projectKey: overnight-builder
    scopes: [project, workflow]
  promotion:
    enabled: true
    minConfidence: 0.8
    confidenceConflictMode: review
    allowedEventTypes:
      - workflow.validation_passed
      - workflow.repair_completed
    applyScopes: [project]
    evaluationMode: latest_effective
    triggers:
      - workflow.validation_passed
      - workflow.repair_completed
      - execution_end
  reviewQueue:
    enabled: true
    adapter: file
    file:
      basePath: /Users/denovo/workspace/github/obora-kit/experiments/overnight-builder/data/.obora/tkg-review-queue
  rollback:
    enabled: true
    adapter: file
    file:
      basePath: /Users/denovo/workspace/github/obora-kit/experiments/overnight-builder/data/.obora/tkg-rollback

dlq:
  enabled: true
  filePath: /Users/denovo/workspace/github/obora-kit/experiments/overnight-builder/data/.obora/dlq/dead-letters.json

executionLock:
  enabled: true
  basePath: /Users/denovo/workspace/github/obora-kit/experiments/overnight-builder/data/.obora/locks
  staleLockThresholdMs: 7200000

autoRecovery:
  enabled: true
  maxRetries: 1
  delayMs: 5000
  driftPolicy: warn

defaults:
  provider: zai
  model: glm-4.7
  temperature: 0.2
  timeout: 900
  maxTokens: 16384

providers:
  zai:
    authMode: global
    authRef: global:zai
    baseUrl: "https://api.z.ai/api/coding/paas/v4"
    defaultModel: glm-5
    timeout: 900
    maxTokens: 16384
