name: math-proof-loop
version: "1.0"
description: "수학 난제급 증명 탐색 루프 검증"

steps:
  - name: problem-frame
    agent: framer
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/input/research-brief.md and /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/input/problem-instance.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/01-math-problem-frame.md.
        한국어 markdown으로 작성.
        반드시 포함:
        - 문제 정의
        - conjecture / target statement
        - assumptions
        - non-goals
        - 이번 iteration의 성공 조건

  - name: known-results-audit
    agent: auditor
    depends_on: [problem-frame]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/01-math-problem-frame.md and /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/input/problem-instance.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/02-known-results-audit.md.
        반드시 포함:
        - known facts
        - permissible assumptions
        - unknowns
        - likely difficulty points

  - name: lemma-and-proof-attempt
    agent: prover
    depends_on: [known-results-audit]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/01-math-problem-frame.md and /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/02-known-results-audit.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/10-lemma-candidates.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/11-proof-attempt.md
        Requirements:
        - lemma 후보를 분리해 제시
        - proof attempt는 단계별로 작성
        - 어디가 아직 비약인지 표시

  - name: counterexample-check
    agent: skeptic
    depends_on: [lemma-and-proof-attempt]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/10-lemma-candidates.md and /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/11-proof-attempt.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/12-counterexample-check.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/13-proof-gap-register.md
        Requirements:
        - 가능한 반례 유형
        - 숨은 가정
        - consistency 문제
        - proof gap 목록(P0/P1/P2)

  - name: review-and-finalize
    agent: reviewer-1
    depends_on: [counterexample-check]
    tools: [file_read, file_write, file_list, review]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/01-math-problem-frame.md, /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/02-known-results-audit.md, /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/10-lemma-candidates.md, /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/11-proof-attempt.md, /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/12-counterexample-check.md, /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/13-proof-gap-register.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/20-math-review-report.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/21-math-remediation-plan.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/22-math-final-conclusion.md
        Requirements:
        - Do NOT require a full proof to pass review.
        - A bounded research conclusion is acceptable if it clearly states gaps and uncertainty.
        - classify the result as one of: solved, partially_supported, unresolved, refuted.
        - identify proof gaps as blockers vs non-blockers.
        - explicitly state whether the current result is archiveable.
        - recommend another loop only when a missing P0 proof gap blocks even a bounded conclusion.
        - if the result is coherent and honestly scoped, prefer archiveable unresolved/partial conclusion over hard failure.

  - name: archive-packaging
    agent: archivist
    depends_on: [review-and-finalize]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/22-math-final-conclusion.md and /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/iterations/13-proof-gap-register.md and /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/final/20-math-review-report.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/archive/40-math-abstract.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/archive/41-math-executive-summary.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/archive/42-math-methodology.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/archive/43-math-decision-log.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/archive/44-math-proof-gap-register.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/math-proof-loop/output/archive/45-math-archive-bundle-index.md
