name: glm47-master-research-loop-compact
version: "1.0"
description: "429 환경을 고려한 compact 연구 루프: 적은 step으로 결론 가능성 검증"

steps:
  - name: frame-and-criteria
    agent: researcher
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md and /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/loop-policy.md.
        Write/update /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/01-problem-frame.md and /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/02-success-criteria.md.
        한국어 markdown으로 작성하세요.
        반드시 포함:
        - 연구 목적
        - 핵심 문제정의
        - 연구 질문
        - 성공 기준
        - 실패 신호
        - 실험 범위/비범위
        Keep the response concise and execution-focused.

  - name: research-and-synthesis
    agent: synthesizer
    depends_on: [frame-and-criteria]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/loop-policy.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/01-problem-frame.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/02-success-criteria.md.
        Write/update the following files:
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/10-research-notes.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/11-findings.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/12-open-questions.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/13-interim-conclusion.md
        Requirements:
        - separate evidence / insight / risk / unresolved questions
        - produce a provisional conclusion
        - explicitly state what requires another loop
        Keep wording compact; prioritize structure over length.

  - name: review-and-finalize
    agent: reviewer-1
    depends_on: [research-and-synthesis]
    tools: [file_read, file_write, file_list, review]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/loop-policy.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/01-problem-frame.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/02-success-criteria.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/10-research-notes.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/11-findings.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/12-open-questions.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/13-interim-conclusion.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/20-review-report.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/21-remediation-plan.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/22-final-conclusion.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/23-loop-decision.md
        Requirements:
        - Do NOT require a perfect or fully closed research result.
        - Accept bounded, coherent, archive-ready conclusions even when limitations remain.
        - review must classify the result as one of: PASS, PASS_WITH_LIMITATIONS, FAIL.
        - review must include P0/P1/P2 issues and explicitly separate blockers from non-blockers.
        - remediation must include only changes required for the next loop if blockers remain.
        - final conclusion must include conclusion, evidence, limitation, unresolved questions, next study.
        - choose `decision: STOP` when the result is archiveable and no P0 blocker remains.
        - choose `decision: CONTINUE` only when unresolved P0 issues materially block a usable conclusion.
        - prefer STOP over CONTINUE when the output is already good enough for bounded research archive.

  - name: archive-or-deferral
    agent: archivist
    depends_on: [review-and-finalize]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/22-final-conclusion.md and /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/23-loop-decision.md.
        If decision is STOP, write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/30-abstract.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/31-executive-summary.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/32-methodology.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/33-decision-log.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/34-archive-bundle-index.md
        If decision is CONTINUE, write /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/34-archive-bundle-index.md as a deferral note explaining why archive is deferred.
