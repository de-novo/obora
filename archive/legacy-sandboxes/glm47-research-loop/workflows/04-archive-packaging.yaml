name: glm47-archive-packaging
version: "1.0"
description: "아카이브 업로드용 문서 패키지 생성"

steps:
  - name: abstract
    agent: archivist
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/22-final-conclusion.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/30-abstract.md.
        1페이지 이내 요약으로 작성하고, 실험 목적/방법/결론을 포함하세요.

  - name: executive-summary
    agent: archivist
    tools: [file_read, file_write, file_list, generate]
    depends_on: [abstract]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/22-final-conclusion.md and /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/20-review-report.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/31-executive-summary.md.
        의사결정권자가 빠르게 읽을 수 있는 형태로 작성하세요.

  - name: methodology
    agent: archivist
    tools: [file_read, file_write, file_list, generate]
    depends_on: [executive-summary]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/01-problem-frame.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/02-success-criteria.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/32-methodology.md.
        실험 절차, 평가 기준, 제한사항을 명시하세요.

  - name: decision-log
    agent: archivist
    tools: [file_read, file_write, file_list, generate]
    depends_on: [methodology]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/13-interim-conclusion.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/21-remediation-plan.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/22-final-conclusion.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/33-decision-log.md.
        핵심 결정, 변경 이유, 보류 항목을 정리하세요.

  - name: bundle-index
    agent: archivist
    tools: [file_read, file_write, file_list, generate]
    depends_on: [decision-log]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/30-abstract.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/31-executive-summary.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/32-methodology.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/33-decision-log.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/34-archive-bundle-index.md.
        각 문서의 목적과 읽는 순서를 안내하세요.
