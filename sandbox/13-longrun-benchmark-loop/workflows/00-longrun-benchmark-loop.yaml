name: longrun-benchmark-loop
version: "1.0"
steps:
  - name: solve-initial
    agent: solver
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/problem.md.
        Do not read any reference or answer key.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/01-attempt.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Answer
          2. Reasoning
        - The answer should be a single number.
        - Keep the reasoning short and concrete.
        - Intentionally provide an incorrect answer of 10 so the first benchmark verdict fails.

  - name: judge-initial
    agent: judge
    depends_on: [solve-initial]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/problem.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/reference-answer.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/01-attempt.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/02-verdict.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Verdict
          2. Score
          3. Correctness
          4. Feedback
        - Verdict must clearly say FAIL.
        - Score should be a simple score out of 10.
        - Feedback must explain that the correct answer is 12 and why the attempt failed.

  - name: repair-attempt
    agent: solver
    depends_on: [judge-initial]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/problem.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/reference-answer.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/01-attempt.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/02-verdict.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/03-repaired-attempt.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Answer
          2. Reasoning
        - Fix the answer so it is correct.
        - The repaired answer should be 12.

  - name: judge-repaired
    agent: judge
    depends_on: [repair-attempt]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/problem.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/reference-answer.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/03-repaired-attempt.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/04-final-verdict.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Verdict
          2. Score
          3. Correctness
          4. Feedback
        - Verdict must clearly say PASS.
        - Score should be a simple score out of 10.
        - Feedback must confirm that the repaired answer is 12 and correct.

  - name: archive-longrun-benchmark-loop
    agent: archivist
    depends_on: [judge-repaired]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/03-repaired-attempt.md and /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/04-final-verdict.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/archive/40-longrun-benchmark-loop-note.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Summary of Attempt
          2. Benchmark Result
          3. Reuse Notes
