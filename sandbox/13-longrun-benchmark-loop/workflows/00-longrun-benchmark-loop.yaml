name: longrun-benchmark-loop
version: "1.0"
steps:
  - name: solve_or_repair
    agent: solver
    config:
      repair_loop:
        enabled: true
        validation_step: judge
        max_no_progress_iterations: 1
        repeated_critical_issue_ceiling: 1
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/problem.md.

        If this is the first attempt:
        - Do not read any reference or answer key.
        - Write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/01-attempt.md.
        - Include exactly these top-level sections:
          1. Answer
          2. Reasoning
        - The answer should be a single number.
        - Keep the reasoning short and concrete.
        - Intentionally provide an incorrect answer of 10 so the first benchmark verdict fails.

        If this is a repair attempt:
        - Also read /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/reference-answer.md.
        - Also read whichever of these files exist:
          - /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/02-verdict.md
          - /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/01-attempt.md
        - Use the injected repair context, especially latestValidation.failedChecks.
        - Repair only the issues identified by the latest judge result.
        - Write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/03-repaired-attempt.md.
        - Keep exactly these top-level sections:
          1. Answer
          2. Reasoning
        - Do not use a fixed scripted repair narrative.

  - name: judge
    agent: judge
    depends_on: [solve_or_repair]
    config:
      validation:
        enabled: true
        emit_structured_result: true
    on_fail:
      goto: solve_or_repair
      max_iterations: 1
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/problem.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/input/reference-answer.md,
        and whichever exists first:
        - /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/03-repaired-attempt.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/01-attempt.md

        Write a human-readable judge report:
        - if judging the first attempt, write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/02-verdict.md
        - if judging the repaired attempt, write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/04-final-verdict.md

        Requirements:
        - Include exactly these top-level sections:
          1. Verdict
          2. Score
          3. Correctness
          4. Feedback
        - Score should be a simple score out of 10.
        - If the answer is still incorrect, Verdict must clearly say FAIL and Feedback must explain that the correct answer is 12 and why the attempt failed.
        - If the answer is correct, Verdict must clearly say PASS and Feedback must confirm that the repaired answer is 12 and correct.

        After writing the report, your assistant response must be ONLY a strict ValidationResult JSON object.
        Do not include markdown fences.
        Do not include prose before or after the JSON.

        Return this exact shape:
        {
          "passed": boolean,
          "summary": "string",
          "failedChecks": [{ "name": "string", "message": "string" }],
          "signature": "stable-signature"
        }

  - name: archive-longrun-benchmark-loop
    agent: archivist
    depends_on: [judge]
    tools: [file_read, file_write]
    input:
      task: |
        Read whichever exists first:
        - /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/03-repaired-attempt.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/01-attempt.md
        Read whichever exists first:
        - /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/04-final-verdict.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/final/02-verdict.md

        Write /Users/denovo/workspace/github/obora-kit/sandbox/13-longrun-benchmark-loop/output/archive/40-longrun-benchmark-loop-note.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Summary of Attempt
          2. Benchmark Result
          3. Reuse Notes
        - Describe the workflow honestly as a runtime-native solve_or_repair <-> judge loop controlled by judge output.
