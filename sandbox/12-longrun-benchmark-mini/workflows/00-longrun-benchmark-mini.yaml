name: longrun-benchmark-mini
version: "1.0"
steps:
  - name: solve-problem
    agent: solver
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/input/problem.md.
        Do not read any reference or answer key.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/output/final/01-attempt.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Answer
          2. Reasoning
        - The answer should be a single number.
        - Keep the reasoning short and concrete.

  - name: judge-attempt
    agent: judge
    depends_on: [solve-problem]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/input/problem.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/input/reference-answer.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/output/final/01-attempt.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/output/final/02-verdict.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Verdict
          2. Score
          3. Correctness
          4. Feedback
        - Verdict should say PASS or FAIL.
        - Score should be a simple score out of 10.
        - If the attempt answer is 15 and the reasoning is consistent, verdict should be PASS.

  - name: archive-longrun-benchmark
    agent: archivist
    depends_on: [judge-attempt]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/output/final/01-attempt.md and /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/output/final/02-verdict.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/12-longrun-benchmark-mini/output/archive/40-longrun-benchmark-note.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Summary of Attempt
          2. Benchmark Result
          3. Reuse Notes
