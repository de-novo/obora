name: longrun-feedback-convergence-loop
version: "1.0"
steps:
  - name: produce-v1
    agent: planner
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/brief.md
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/rubric.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/01-v1.md.

        Create a concise rollout note that uses exactly these top-level Markdown H1 sections and no others:
          1. Objective
          2. Constraints
          3. Proposed Approach
          4. Risks
          5. Success Check

        Candidate v1 rules:
        - Make the note clearly about Obora canonical sandbox step 20.
        - Explicitly satisfy only rubric checks C1, C2, C3, and C4.
        - In Success Check, include exactly four bullets labeled C1 through C4.
        - Do not mention or satisfy C5 through C10 anywhere in the file.
        - Keep the note concise, operational, and sandbox-local.

  - name: evaluate-v1
    agent: evaluator
    depends_on: [produce-v1]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/rubric.md
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/01-v1.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/02-eval-v1.md.

        Evaluate the candidate strictly against rubric checks C1 through C10.

        Scoring rule:
        - A check passes only if the candidate explicitly and concretely satisfies that checklist item.
        - Score equals the count of passed checks.
        - Report the score as an integer out of 10.

        Output requirements:
        - Use exactly these top-level Markdown H1 sections and no others:
          1. Score
          2. Passed Checks
          3. Failed Checks
          4. Next Action
        - Under Score, put the score on its own line in the form N/10.
        - In Passed Checks and Failed Checks, list checklist IDs with one short reason each.
        - In Next Action, direct the revision to preserve passes and add the failed checks needed next.

  - name: revise-v2
    agent: reviser
    depends_on: [evaluate-v1]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/brief.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/rubric.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/01-v1.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/02-eval-v1.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/03-v2.md.

        Revise the rollout note using the prior evaluation feedback.

        Candidate v2 rules:
        - Keep exactly these top-level Markdown H1 sections and no others:
          1. Objective
          2. Constraints
          3. Proposed Approach
          4. Risks
          5. Success Check
        - Preserve all passed checks from v1.
        - Add rubric checks C5 and C6.
        - Do not mention or satisfy C7 through C10 yet.
        - In Proposed Approach, include a bullet that begins exactly with: Feedback applied from 02-eval-v1:
        - That feedback bullet must describe only this revision step, not a general rule for every revision.
        - In Success Check, include exactly six bullets labeled C1 through C6.

  - name: evaluate-v2
    agent: evaluator
    depends_on: [revise-v2]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/rubric.md
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/03-v2.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/04-eval-v2.md.

        Evaluate the candidate strictly against rubric checks C1 through C10.

        Scoring rule:
        - A check passes only if the candidate explicitly and concretely satisfies that checklist item.
        - Score equals the count of passed checks.
        - Report the score as an integer out of 10.

        Output requirements:
        - Use exactly these top-level Markdown H1 sections and no others:
          1. Score
          2. Passed Checks
          3. Failed Checks
          4. Next Action
        - Under Score, put the score on its own line in the form N/10.
        - In Passed Checks and Failed Checks, list checklist IDs with one short reason each.
        - In Next Action, direct the next revision to preserve passes and add the next missing checks.

  - name: revise-v3
    agent: reviser
    depends_on: [evaluate-v2]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/brief.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/rubric.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/03-v2.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/04-eval-v2.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/05-v3.md.

        Revise the rollout note using the prior evaluation feedback.

        Candidate v3 rules:
        - Keep exactly these top-level Markdown H1 sections and no others:
          1. Objective
          2. Constraints
          3. Proposed Approach
          4. Risks
          5. Success Check
        - Preserve all passed checks from v2.
        - Add rubric checks C7 and C8.
        - Do not mention or satisfy C9 or C10 yet.
        - In Proposed Approach, include a bullet that begins exactly with: Feedback applied from 04-eval-v2:
        - In Constraints, state as a standing workflow rule that every revision after v1 reads and applies the immediately previous evaluation feedback.
        - Describe the archive-note requirement inside Proposed Approach or Success Check only; do not create a separate top-level Archive Note section.
        - In Success Check, include exactly eight bullets labeled C1 through C8.

  - name: evaluate-v3
    agent: evaluator
    depends_on: [revise-v3]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/rubric.md
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/05-v3.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/06-eval-v3.md.

        Evaluate the candidate strictly against rubric checks C1 through C10.

        Scoring rule:
        - A check passes only if the candidate explicitly and concretely satisfies that checklist item.
        - Score equals the count of passed checks.
        - Report the score as an integer out of 10.

        Output requirements:
        - Use exactly these top-level Markdown H1 sections and no others:
          1. Score
          2. Passed Checks
          3. Failed Checks
          4. Next Action
        - Under Score, put the score on its own line in the form N/10.
        - In Passed Checks and Failed Checks, list checklist IDs with one short reason each.
        - In Next Action, direct the next revision to preserve passes and add the remaining checks needed to converge.

  - name: revise-v4
    agent: reviser
    depends_on: [evaluate-v3]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/brief.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/rubric.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/05-v3.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/06-eval-v3.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/07-v4.md.

        Revise the rollout note using the prior evaluation feedback.

        Candidate v4 rules:
        - Keep exactly these top-level Markdown H1 sections and no others:
          1. Objective
          2. Constraints
          3. Proposed Approach
          4. Risks
          5. Success Check
        - Preserve all passed checks from v3.
        - Add rubric checks C9 and C10.
        - In Proposed Approach, include a bullet that begins exactly with: Feedback applied from 06-eval-v3:
        - Describe verification invariants and reuse guidance inside the existing five sections only; do not create separate top-level sections such as Verification Invariants or Archive Note.
        - In Success Check, include exactly ten bullets labeled C1 through C10.
        - Make the candidate clearly ready to stop because the threshold has been reached.

  - name: evaluate-v4
    agent: evaluator
    depends_on: [revise-v4]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/input/rubric.md
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/07-v4.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/08-eval-v4.md.

        Evaluate the candidate strictly against rubric checks C1 through C10.

        Scoring rule:
        - A check passes only if the candidate explicitly and concretely satisfies that checklist item.
        - Score equals the count of passed checks.
        - Report the score as an integer out of 10.

        Output requirements:
        - Use exactly these top-level Markdown H1 sections and no others:
          1. Score
          2. Passed Checks
          3. Failed Checks
          4. Next Action
        - Under Score, put the score on its own line in the form N/10.
        - In Passed Checks and Failed Checks, list checklist IDs with one short reason each.
        - Final score must be at least 9/10.
        - In Next Action, state that the threshold was reached and the convergence loop can be archived.

  - name: archive-convergence
    agent: archivist
    depends_on: [evaluate-v4]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/01-v1.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/02-eval-v1.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/03-v2.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/04-eval-v2.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/05-v3.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/06-eval-v3.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/07-v4.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/final/08-eval-v4.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/20-longrun-feedback-convergence-loop/output/archive/40-feedback-convergence-note.md.

        Requirements:
        - Use exactly these top-level Markdown H1 sections and no others:
          1. Summary of Convergence
          2. Score Trajectory
          3. Reuse Notes
        - Explain that this sandbox demonstrates repeated evaluation-driven improvement toward a threshold, not one-shot repair.
        - Score Trajectory must explicitly show the sequence 4 -> 6 -> 8 -> 10.
        - Reuse Notes should explain how the same pattern can be adapted to other small structured checklist tasks.
