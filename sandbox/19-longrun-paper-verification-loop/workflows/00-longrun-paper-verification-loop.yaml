name: longrun-paper-verification-loop
version: "1.0"
steps:
  - name: verify-paper-claims-initial
    agent: verifier
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/input/paper-metadata.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/input/paper-excerpts.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/input/claims.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/01-paper-verification.md.

        Requirements:
        - Use only the provided vendored fixture. Do not rely on outside knowledge or live web access.
        - Verify exactly the four listed claims.
        - Do not add a document title or any extra section before the required sections.
        - Use Markdown H1 headings for the required sections and do not number them.
        - Include exactly these top-level sections:
          1. Paper Metadata
          2. Verification Summary
          3. Claim-by-Claim Assessment
          4. Evidence Notes
          5. Final Verdict
        - In Claim-by-Claim Assessment, include all four claims and mark each one as exactly one of: SUPPORTED, PARTIAL, UNSUPPORTED.
        - Cite supporting excerpt IDs such as Excerpt A or Excerpt E for Claim 1, Claim 2, and Claim 4.
        - For Claim 3, intentionally leave the evidence mapping incomplete: mark it PARTIAL and describe the support only in general terms without citing any excerpt ID directly in that claim entry.
        - In Evidence Notes, include concise notes for Claim 1, Claim 2, and Claim 4 only. Do not include a dedicated evidence note for Claim 3.
        - Final Verdict must clearly state that the report is not yet sufficient for acceptance and needs remediation.
        - Keep the report concise, plausible, reproducible, and grounded in the supplied text.

  - name: validate-paper-verification
    agent: validator
    depends_on: [verify-paper-claims-initial]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/01-paper-verification.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/02-paper-validation.md.

        Validate against this checklist:
        - includes exactly the five required top-level sections
        - assesses Claim 1, Claim 2, Claim 3, and Claim 4
        - each claim entry uses one of SUPPORTED, PARTIAL, UNSUPPORTED
        - Claim 1, Claim 2, Claim 3, and Claim 4 each have a concrete excerpt mapping in the claim entry
        - Evidence Notes cover Claim 1, Claim 2, Claim 3, and Claim 4
        - the report is sufficiently complete to accept as a canonical verification result

        Requirements:
        - Do not add a document title or any extra section before the required sections.
        - Use Markdown H1 headings for the required sections and do not number them.
        - Include exactly these top-level sections:
          1. Verdict
          2. Passed Checks
          3. Failed Checks
          4. Next Action
        - Verdict must clearly say FAIL.
        - Failed Checks must explicitly identify Claim 3 as missing sufficiently concrete excerpt mapping or evidence coverage.
        - Next Action must direct the workflow to repair the report using the same vendored fixture only.

  - name: repair-paper-verification
    agent: repairer
    depends_on: [validate-paper-verification]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/input/paper-metadata.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/input/paper-excerpts.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/input/claims.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/01-paper-verification.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/02-paper-validation.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/03-repaired-paper-verification.md.

        Requirements:
        - Use only the provided vendored fixture. Do not rely on outside knowledge or live web access.
        - Keep the same document shape with exactly these top-level sections:
          1. Paper Metadata
          2. Verification Summary
          3. Claim-by-Claim Assessment
          4. Evidence Notes
          5. Final Verdict
        - Verify exactly the four listed claims.
        - In Claim-by-Claim Assessment, include all four claims and mark each one as exactly one of: SUPPORTED, PARTIAL, UNSUPPORTED.
        - Every claim entry must include concrete excerpt IDs.
        - Evidence Notes must include a dedicated note for Claim 1, Claim 2, Claim 3, and Claim 4.
        - Repair the earlier gap by giving Claim 3 explicit evidence mapping from the provided excerpts only.
        - Final Verdict must clearly state that the repaired report is now sufficient for acceptance.
        - Keep the report concise, reproducible, and grounded in the supplied text.

  - name: validate-repaired-paper-verification
    agent: validator
    depends_on: [repair-paper-verification]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/03-repaired-paper-verification.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/04-final-paper-validation.md.

        Validate against this checklist:
        - includes exactly the five required top-level sections
        - assesses Claim 1, Claim 2, Claim 3, and Claim 4
        - each claim entry uses one of SUPPORTED, PARTIAL, UNSUPPORTED
        - Claim 1, Claim 2, Claim 3, and Claim 4 each have a concrete excerpt mapping in the claim entry
        - Evidence Notes cover Claim 1, Claim 2, Claim 3, and Claim 4
        - the repaired report is sufficiently complete to accept as a canonical verification result

        Requirements:
        - Do not add a document title or any extra section before the required sections.
        - Use Markdown H1 headings for the required sections and do not number them.
        - Include exactly these top-level sections:
          1. Verdict
          2. Passed Checks
          3. Failed Checks
          4. Next Action
        - Verdict must clearly say PASS.
        - Failed Checks should explicitly say none.
        - Next Action should say the verification loop is complete and can be archived.

  - name: archive-paper-verification
    agent: archivist
    depends_on: [validate-repaired-paper-verification]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/01-paper-verification.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/02-paper-validation.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/03-repaired-paper-verification.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/final/04-final-paper-validation.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/19-longrun-paper-verification-loop/output/archive/40-paper-verification-loop-note.md.

        Requirements:
        - Do not add a document title or any extra section before the required sections.
        - Use Markdown H1 headings for the required sections and do not number them.
        - Include exactly these top-level sections:
          1. Summary of Verification Loop
          2. Final Paper Verification Result
          3. Reuse Notes
        - Summarize the initial FAIL state, the Claim 3 evidence remediation, and the final PASS state.
        - Reuse Notes should explain that this sandbox demonstrates a minimal paper verification remediation loop against vendored excerpts, not full paper reproduction.
