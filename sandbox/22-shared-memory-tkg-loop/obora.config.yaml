version: "1.0"
workflows: ./workflows
policies: .

persistence:
  enabled: true
  adapter: sqlite
  sqlite:
    path: ./data/obora.db

artifacts:
  enabled: true
  store: local
  local:
    basePath: ./data/artifacts

sharedMemory:
  enabled: true
  adapter: file
  file:
    basePath: /Users/denovo/workspace/github/obora-kit/sandbox/22-shared-memory-tkg-loop/data/.obora/shared-memory
    projectKey: shared-memory-tkg-loop
    scopes: [project, workflow]

tkgProjection:
  enabled: true
  adapter: file
  file:
    basePath: /Users/denovo/workspace/github/obora-kit/sandbox/22-shared-memory-tkg-loop/data/.obora/tkg-staging
    projectKey: shared-memory-tkg-loop
    scopes: [project, workflow]
  promotion:
    enabled: true
    minConfidence: 0.8
    confidenceConflictMode: blocking
    allowedEventTypes:
      - workflow.validation_passed
      - workflow.repair_completed
    applyScopes: [project]
    evaluationMode: latest_effective
    triggers:
      - workflow.validation_passed
      - workflow.repair_completed
      - execution_end
  reviewQueue:
    enabled: true
    adapter: file
    file:
      basePath: /Users/denovo/workspace/github/obora-kit/sandbox/22-shared-memory-tkg-loop/data/.obora/tkg-review-queue
  rollback:
    enabled: true
    adapter: file
    file:
      basePath: /Users/denovo/workspace/github/obora-kit/sandbox/22-shared-memory-tkg-loop/data/.obora/tkg-rollback

defaults:
  provider: zai
  model: glm-5
  temperature: 0.2
  timeout: 180
  maxTokens: 4096

providers:
  zai:
    authMode: global
    authRef: global:zai
    defaultModel: glm-5
    timeout: 180
    maxTokens: 4096
