name: benchmark-loop
version: "1.0"
steps:
  - name: solve-initial
    agent: solver
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/input/problem.md.
        Do not read the reference answer.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/01-attempt.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Answer
          2. Reasoning
        - Intentionally provide an incorrect final answer of 8 so the first benchmark verdict fails.

  - name: judge-initial
    agent: judge
    depends_on: [solve-initial]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/input/problem.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/input/reference-answer.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/01-attempt.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/02-verdict.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Verdict
          2. Score
          3. Correctness
          4. Feedback
        - Verdict must clearly say FAIL.

  - name: repair-attempt
    agent: solver
    depends_on: [judge-initial]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/input/problem.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/input/reference-answer.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/02-verdict.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/03-repaired-attempt.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Answer
          2. Reasoning
        - Fix the answer so it is correct.

  - name: judge-repaired
    agent: judge
    depends_on: [repair-attempt]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/input/problem.md,
        /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/input/reference-answer.md,
        and /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/03-repaired-attempt.md.

        Write /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/04-final-verdict.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Verdict
          2. Score
          3. Correctness
          4. Feedback
        - Verdict must clearly say PASS.

  - name: archive-benchmark-loop
    agent: archivist
    depends_on: [judge-repaired]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/03-repaired-attempt.md and /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/final/04-final-verdict.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/09-benchmark-loop/output/archive/40-benchmark-loop-archive-note.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Summary of Attempt
          2. Benchmark Result
          3. Reuse Notes
