name: longrun-project-mini
version: "1.0"
steps:
  - name: draft-project
    agent: writer
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/input/brief.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/final/01-draft.md.

        Requirements:
        - The draft must contain exactly these top-level sections:
          1. Project Summary
          2. Scope
          3. Next Action
        - Keep it concise and practical.

  - name: review-project
    agent: reviewer
    depends_on: [draft-project]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/input/brief.md and /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/final/01-draft.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/final/02-review.md and /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/final/03-final.md.

        Requirements for 02-review.md:
        - Include exactly these top-level sections:
          1. Strengths
          2. Issues
          3. Suggested Revisions

        Requirements for 03-final.md:
        - Include exactly these top-level sections:
          1. Final Summary
          2. Final Scope
          3. Changes Applied
          4. Next Action

  - name: validate-project
    agent: validator
    depends_on: [review-project]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/final/03-final.md.
        Validate against this checklist:
        - contains Final Summary
        - contains Final Scope
        - contains Changes Applied
        - contains Next Action
        - concise and coherent

        Write /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/final/04-validation.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Verdict
          2. Passed Checks
          3. Failed Checks
          4. Next Action
        - Verdict must clearly say PASS or FAIL.
        - If all checklist items are satisfied, verdict should be PASS.

  - name: archive-project
    agent: archivist
    depends_on: [validate-project]
    tools: [file_read, file_write]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/final/03-final.md and /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/final/04-validation.md.
        Write /Users/denovo/workspace/github/obora-kit/sandbox/14-longrun-project-mini/output/archive/40-longrun-project-note.md.

        Requirements:
        - Include exactly these top-level sections:
          1. Summary of Project
          2. Why Archived
          3. Reuse Notes
