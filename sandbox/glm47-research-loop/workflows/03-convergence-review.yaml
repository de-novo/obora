name: glm47-convergence-review
version: "1.0"
description: "리뷰, 수정 계획, 최종 결론 도출"

steps:
  - name: review-context-fidelity
    pattern: consensus
    participants: [reviewer-1, reviewer-2, reviewer-3]
    tools: [file_read, file_write, file_list, review]
    input:
      task: |
        Read input/research-brief.md, output/final/01-problem-frame.md, output/final/02-success-criteria.md, and output/iterations/13-interim-conclusion.md.
        Write output/final/20-review-report.md.
        Output in Korean markdown.
        반드시 포함:
        - PASS 또는 FAIL
        - 문제정의와 결론의 정합성 평가
        - 반복 루프 설계 평가
        - 아카이브 준비도 평가
        - 이슈 목록(P0/P1/P2)
        - 수정 액션

  - name: remediation-plan
    agent: synthesizer
    tools: [file_read, file_write, file_list, generate]
    depends_on: [review-context-fidelity]
    input:
      task: |
        Read output/final/20-review-report.md and output/iterations/13-interim-conclusion.md.
        Write output/final/21-remediation-plan.md.
        반드시 포함:
        - 수정 대상
        - 수정 이유
        - 수정 후 기대 개선
        - 남는 리스크

  - name: final-conclusion
    agent: synthesizer
    tools: [file_read, file_write, file_list, generate]
    depends_on: [remediation-plan]
    input:
      task: |
        Read input/research-brief.md, output/final/20-review-report.md, output/final/21-remediation-plan.md, output/iterations/13-interim-conclusion.md.
        Write output/final/22-final-conclusion.md.
        반드시 포함:
        - 최종 결론
        - 확인된 한계
        - 다음 실험 제안
        - GLM-4.7 단일모델 운영에 대한 판단
        - Obora 아키텍처 활용 평가
