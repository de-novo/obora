name: glm47-master-research-loop-compact
version: "1.0"
description: "429 환경을 고려한 compact 연구 루프: 적은 step으로 결론 가능성 검증"

steps:
  - name: frame-and-criteria
    agent: researcher
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md and input/loop-policy.md.
        Write/update output/final/01-problem-frame.md and output/final/02-success-criteria.md.
        한국어 markdown으로 작성하세요.
        반드시 포함:
        - 연구 목적
        - 핵심 문제정의
        - 연구 질문
        - 성공 기준
        - 실패 신호
        - 실험 범위/비범위
        Keep the response concise and execution-focused.

  - name: research-and-synthesis
    agent: synthesizer
    depends_on: [frame-and-criteria]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md, input/loop-policy.md, output/final/01-problem-frame.md, output/final/02-success-criteria.md.
        Write/update the following files:
        - output/iterations/10-research-notes.md
        - output/iterations/11-findings.md
        - output/iterations/12-open-questions.md
        - output/iterations/13-interim-conclusion.md
        Requirements:
        - separate evidence / insight / risk / unresolved questions
        - produce a provisional conclusion
        - explicitly state what requires another loop
        Keep wording compact; prioritize structure over length.

  - name: review-and-finalize
    pattern: consensus
    participants: [reviewer-1, reviewer-2, reviewer-3]
    depends_on: [research-and-synthesis]
    tools: [file_read, file_write, file_list, review]
    input:
      task: |
        Read input/research-brief.md, input/loop-policy.md, output/final/01-problem-frame.md, output/final/02-success-criteria.md, output/iterations/13-interim-conclusion.md.
        Write/update:
        - output/final/20-review-report.md
        - output/final/21-remediation-plan.md
        - output/final/22-final-conclusion.md
        - output/final/23-loop-decision.md
        Requirements:
        - review must include PASS/FAIL and P0/P1/P2 issues
        - remediation must include what to fix and why
        - final conclusion must include conclusion, evidence, limitation, next study
        - loop decision must include `decision: CONTINUE` or `decision: STOP`
        - choose STOP if bounded conclusion is good enough for archive packaging

  - name: archive-or-deferral
    agent: archivist
    depends_on: [review-and-finalize]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read output/final/22-final-conclusion.md and output/final/23-loop-decision.md.
        If decision is STOP, write/update:
        - output/archive/30-abstract.md
        - output/archive/31-executive-summary.md
        - output/archive/32-methodology.md
        - output/archive/33-decision-log.md
        - output/archive/34-archive-bundle-index.md
        If decision is CONTINUE, write output/archive/34-archive-bundle-index.md as a deferral note explaining why archive is deferred.
