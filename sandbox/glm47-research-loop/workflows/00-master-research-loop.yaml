name: glm47-master-research-loop
version: "1.0"
description: "문제정의→연구→리뷰→보정→판정→아카이브의 반복형 마스터 루프"

steps:
  - name: initialize-loop
    agent: researcher
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md and input/loop-policy.md.
        Update output/final/00-loop-state.md.
        Set status to RUNNING and next_action to RUN_PROBLEM_FRAMING.
        Summarize loop objective, max iterations, and stopping policy.

  - name: problem-framing
    agent: researcher
    depends_on: [initialize-loop]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md and write/update output/final/01-problem-frame.md.
        Include experiment objective, research question, success/failure criteria, and scope.

  - name: success-criteria
    agent: analyst
    depends_on: [problem-framing]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md, input/loop-policy.md, output/final/01-problem-frame.md.
        Write/update output/final/02-success-criteria.md.

  - name: research-notes
    agent: researcher
    depends_on: [success-criteria]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md, output/final/01-problem-frame.md, output/final/02-success-criteria.md.
        Write/update output/iterations/10-research-notes.md.
        Explicitly note what is newly learned in this iteration.

  - name: findings-analysis
    agent: analyst
    depends_on: [research-notes]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read output/iterations/10-research-notes.md.
        Write/update output/iterations/11-findings.md.
        Separate insights, bottlenecks, and risks.

  - name: open-questions
    agent: analyst
    depends_on: [findings-analysis]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read output/iterations/11-findings.md.
        Write/update output/iterations/12-open-questions.md.
        Explicitly list unresolved issues requiring another iteration.

  - name: interim-conclusion
    agent: synthesizer
    depends_on: [open-questions]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md, output/iterations/10-research-notes.md, output/iterations/11-findings.md, output/iterations/12-open-questions.md.
        Write/update output/iterations/13-interim-conclusion.md.
        State current conclusion confidence and remaining uncertainty.

  - name: convergence-review
    pattern: consensus
    participants: [reviewer-1, reviewer-2, reviewer-3]
    depends_on: [interim-conclusion]
    tools: [file_read, file_write, file_list, review]
    input:
      task: |
        Read input/research-brief.md, input/loop-policy.md, output/final/01-problem-frame.md, output/final/02-success-criteria.md, output/iterations/13-interim-conclusion.md.
        Write/update output/final/20-review-report.md.
        Must include PASS/FAIL, P0/P1/P2 issues, whether another loop is needed, and why.

  - name: remediation-plan
    agent: synthesizer
    depends_on: [convergence-review]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read output/final/20-review-report.md and output/iterations/13-interim-conclusion.md.
        Write/update output/final/21-remediation-plan.md.
        Include what to fix, why, and what improvement is expected next loop.

  - name: final-conclusion
    agent: synthesizer
    depends_on: [remediation-plan]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md, input/loop-policy.md, output/final/20-review-report.md, output/final/21-remediation-plan.md, output/iterations/13-interim-conclusion.md.
        Write/update output/final/22-final-conclusion.md.
        Include final conclusion, evidence, limitations, and next-study proposal.

  - name: loop-judge
    agent: reviewer-1
    depends_on: [final-conclusion]
    tools: [file_read, file_write, file_list, review]
    input:
      task: |
        Read input/loop-policy.md, output/final/00-loop-state.md, output/final/20-review-report.md, output/final/21-remediation-plan.md, output/final/22-final-conclusion.md.
        Write/update output/final/23-loop-decision.md.
        Decide CONTINUE or STOP using the loop policy.

  - name: archive-packaging
    agent: archivist
    depends_on: [loop-judge]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read output/final/23-loop-decision.md and output/final/22-final-conclusion.md.
        If decision indicates STOP or archive-ready, write/update:
        - output/archive/30-abstract.md
        - output/archive/31-executive-summary.md
        - output/archive/32-methodology.md
        - output/archive/33-decision-log.md
        - output/archive/34-archive-bundle-index.md
        If not archive-ready, explicitly write an archive deferral note into output/archive/34-archive-bundle-index.md.
