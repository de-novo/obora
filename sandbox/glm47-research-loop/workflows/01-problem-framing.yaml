name: glm47-problem-framing
version: "1.0"
description: "문제정의와 성공 기준을 문서화"

steps:
  - name: frame-problem
    agent: researcher
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md and write output/final/01-problem-frame.md.
        한국어 markdown으로 작성하세요.
        반드시 포함:
        - 실험 목적
        - 핵심 문제정의
        - 검증 질문 3개
        - 성공 기준
        - 실패 신호
        - 실험 범위/비범위

  - name: define-success-criteria
    agent: analyst
    tools: [file_read, file_write, file_list, generate]
    depends_on: [frame-problem]
    input:
      task: |
        Read input/research-brief.md and output/final/01-problem-frame.md.
        Write output/final/02-success-criteria.md.
        반드시 포함:
        - Context Fidelity 기준
        - Workflow Leverage 기준
        - Convergence 기준
        - Archive Readiness 기준
        - PASS / SOFT_FAIL / FAIL 판정 규칙
