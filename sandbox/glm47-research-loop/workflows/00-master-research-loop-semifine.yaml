name: glm47-master-research-loop-semifine
version: "1.0"
description: "semi-compact에서 research-synthesis를 분해한 세밀 버전"

steps:
  - name: problem-frame
    agent: researcher
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read input/research-brief.md.
        Write/update /Users/denovo/workspace/github/obora-kit/output/final/01-problem-frame.md.
        한국어 markdown, 짧고 명확하게 작성.
        포함:
        - 연구 목적
        - 핵심 문제정의
        - 연구 질문 3개
        - 범위 / 비범위

  - name: success-criteria
    agent: analyst
    depends_on: [problem-frame]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/loop-policy.md, /Users/denovo/workspace/github/obora-kit/output/final/01-problem-frame.md.
        Write/update /Users/denovo/workspace/github/obora-kit/output/final/02-success-criteria.md.
        한국어 markdown, 짧고 명확하게 작성.
        포함:
        - 성공 기준
        - 실패 신호
        - 종료 조건
        - 재진입 조건

  - name: research-findings
    agent: researcher
    depends_on: [success-criteria]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/output/final/01-problem-frame.md, /Users/denovo/workspace/github/obora-kit/output/final/02-success-criteria.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/output/iterations/10-research-notes.md
        - /Users/denovo/workspace/github/obora-kit/output/iterations/11-findings.md
        Requirements:
        - evidence / observation / hypothesis / risk 를 분리
        - 긴 문장보다 구조 중심
        - 논문형 연구 검증 관점 유지

  - name: questions-and-interim
    agent: synthesizer
    depends_on: [research-findings]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/output/iterations/10-research-notes.md and /Users/denovo/workspace/github/obora-kit/output/iterations/11-findings.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/output/iterations/12-open-questions.md
        - /Users/denovo/workspace/github/obora-kit/output/iterations/13-interim-conclusion.md
        Requirements:
        - unresolved questions 명시
        - 잠정 결론 명시
        - 다음 loop 필요 여부 명시
        Keep it compact.

  - name: review-final-decision
    pattern: consensus
    participants: [reviewer-1, reviewer-2, reviewer-3]
    depends_on: [questions-and-interim]
    tools: [file_read, file_write, file_list, review]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/loop-policy.md, /Users/denovo/workspace/github/obora-kit/output/final/01-problem-frame.md, /Users/denovo/workspace/github/obora-kit/output/final/02-success-criteria.md, /Users/denovo/workspace/github/obora-kit/output/iterations/13-interim-conclusion.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/output/final/20-review-report.md
        - /Users/denovo/workspace/github/obora-kit/output/final/21-remediation-plan.md
        - /Users/denovo/workspace/github/obora-kit/output/final/22-final-conclusion.md
        - /Users/denovo/workspace/github/obora-kit/output/final/23-loop-decision.md
        Requirements:
        - review: PASS/FAIL, P0/P1/P2 issues
        - remediation: what to fix / why
        - final conclusion: conclusion / evidence / limitation / next study
        - if review decision is FAIL, loop decision MUST be `decision: CONTINUE`
        - only when review decision is PASS may loop decision be `decision: STOP`
        - loop decision must contain exactly one of:
          - decision: CONTINUE
          - decision: STOP

  - name: archive-or-deferral
    agent: archivist
    depends_on: [review-final-decision]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/output/final/22-final-conclusion.md and /Users/denovo/workspace/github/obora-kit/output/final/23-loop-decision.md.
        If decision is STOP, write/update:
        - /Users/denovo/workspace/github/obora-kit/output/archive/30-abstract.md
        - /Users/denovo/workspace/github/obora-kit/output/archive/31-executive-summary.md
        - /Users/denovo/workspace/github/obora-kit/output/archive/32-methodology.md
        - /Users/denovo/workspace/github/obora-kit/output/archive/33-decision-log.md
        - /Users/denovo/workspace/github/obora-kit/output/archive/34-archive-bundle-index.md
        If decision is CONTINUE, write /Users/denovo/workspace/github/obora-kit/output/archive/34-archive-bundle-index.md as a short deferral note.
