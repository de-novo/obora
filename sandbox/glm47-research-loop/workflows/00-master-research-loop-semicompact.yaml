name: glm47-master-research-loop-semicompact
version: "1.0"
description: "429 + timeout 환경을 고려한 semi-compact 연구 루프"

steps:
  - name: problem-frame
    agent: researcher
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md.
        Write/update /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/01-problem-frame.md.
        한국어 markdown, 짧고 명확하게 작성.
        반드시 포함:
        - 연구 목적
        - 핵심 문제정의
        - 연구 질문 3개
        - 범위 / 비범위

  - name: success-criteria
    agent: analyst
    depends_on: [problem-frame]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/loop-policy.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/01-problem-frame.md.
        Write/update /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/02-success-criteria.md.
        한국어 markdown, 짧고 명확하게 작성.
        반드시 포함:
        - 성공 기준
        - 실패 신호
        - 종료 조건
        - 재진입 조건

  - name: research-synthesis
    agent: synthesizer
    depends_on: [success-criteria]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/01-problem-frame.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/02-success-criteria.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/10-research-notes.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/11-findings.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/12-open-questions.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/13-interim-conclusion.md
        Requirements:
        - evidence / insight / risk / unresolved questions를 분리
        - 잠정 결론 제시
        - 다음 루프 필요 여부 명시
        Keep it structured and compact.

  - name: review-final-decision
    pattern: consensus
    participants: [reviewer-1, reviewer-2, reviewer-3]
    depends_on: [research-synthesis]
    tools: [file_read, file_write, file_list, review]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/research-brief.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/input/loop-policy.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/01-problem-frame.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/02-success-criteria.md, /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/iterations/13-interim-conclusion.md.
        Write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/20-review-report.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/21-remediation-plan.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/22-final-conclusion.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/23-loop-decision.md
        Requirements:
        - review: PASS/FAIL, P0/P1/P2 issues
        - remediation: what to fix / why
        - final conclusion: conclusion / evidence / limitation / next study
        - loop decision must contain exactly one of:
          - decision: CONTINUE
          - decision: STOP
        Prefer STOP if bounded conclusion is good enough.

  - name: archive-or-deferral
    agent: archivist
    depends_on: [review-final-decision]
    tools: [file_read, file_write, file_list, generate]
    input:
      task: |
        Read /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/22-final-conclusion.md and /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/final/23-loop-decision.md.
        If decision is STOP, write/update:
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/30-abstract.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/31-executive-summary.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/32-methodology.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/33-decision-log.md
        - /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/34-archive-bundle-index.md
        If decision is CONTINUE, write /Users/denovo/workspace/github/obora-kit/sandbox/glm47-research-loop/output/archive/34-archive-bundle-index.md as a short deferral note.
