version: "1.0"
workflows: ./workflows

persistence:
  enabled: true
  adapter: sqlite
  sqlite:
    path: ./.obora/data.db

artifacts:
  enabled: true
  store: local
  local:
    basePath: ./.obora/artifacts

defaults:
  provider: zai
  model: glm-5
  temperature: 0.2
  timeout: 180
  maxTokens: 8192

providers:
  zai:
    authMode: global
    authRef: global:zai
    defaultModel: glm-5
    timeout: 180
    maxTokens: 8192
