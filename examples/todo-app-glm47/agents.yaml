version: "1.0"
default_model: glm-4.7
agents:
  product-manager:
    role: 제품 요구사항/사용자 스토리/MVP 범위를 정의합니다.
    model: glm-4.7
  architect:
    role: 시스템 구조, 데이터 모델, 폴더 구조를 설계합니다.
    model: glm-4.7
  designer:
    role: UI/UX 스펙과 컴포넌트 인터랙션을 설계합니다.
    model: glm-4.7
  developer:
    role: React + TypeScript로 기능을 구현합니다.
    model: glm-4.7
  reviewer-1:
    role: 아키텍처/코드품질 리뷰를 수행합니다.
    model: glm-4.7
  reviewer-2:
    role: UX/접근성 관점 리뷰를 수행합니다.
    model: glm-4.7
  reviewer-3:
    role: 성능/안정성 관점 리뷰를 수행합니다.
    model: glm-4.7

  pencil-designer:
    role: de-novo/pencil-skill 기반 디자인 시스템/컴포넌트 명세 전문 디자이너
    model: glm-4.7
