name: todo-app-02-architecture
version: "1.0"
description: "Todo App 아키텍처 단계 (planning 결과 기반)"
policy: ../policy.yaml

steps:
  - name: architecture
    agent: architect
    input:
      planning_doc: "{{input.planning_doc}}"
      task: |
        planning_doc를 기반으로 아키텍처 문서를 작성하세요.
        포함 항목:
        - React 컴포넌트 구조도
        - Todo 데이터 모델
        - 상태 관리 전략
        - localStorage 영속화 전략
        - 폴더 구조
