name: todo-app-05-implementation
version: "1.0"
description: "구현 단계 (React+TypeScript)"
policy: ../policy.yaml

steps:
  - name: implementation
    agent: developer
    input:
      planning_doc: "{{input.planning_doc}}"
      architecture_doc: "{{input.architecture_doc}}"
      ui_spec: "{{input.ui_spec}}"
      task: |
        planning_doc, architecture_doc, ui_spec를 기반으로 Todo App 코드를 작성하세요.
        요구사항:
        - React + TypeScript
        - TodoApp/TodoList/TodoItem/AddTodo/FilterBar 컴포넌트
        - 추가/완료토글/삭제/필터/우선순위
        - localStorage 영속화
