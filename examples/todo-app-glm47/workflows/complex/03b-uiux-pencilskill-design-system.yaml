name: todo-app-03b-uiux-pencilskill-design-system
version: "2.1"
description: "UI/UX + design system pipeline with back-edge review loop"
policy: ../../policy.yaml

steps:
  - name: uiux-spec
    agent: designer
    tools: [file_write, file_read, file_list, generate]
    input:
      task: |
        Read docs/10~12 and write docs/20-uiux-spec.md.
        Include IA, user flow, screen states, accessibility.

  - name: design-system
    agent: designer
    tools: [file_write, file_read, file_list, generate]
    depends_on: [uiux-spec]
    input:
      task: |
        Read docs/20-uiux-spec.md.
        Write docs/21-design-system.md and docs/21-design-tokens.json.

  - name: component-specs
    agent: designer
    tools: [file_write, file_read, file_list, generate]
    depends_on: [design-system]
    input:
      task: |
        Write docs/22-component-specs.md with API/states/a11y for key components.

  - name: uiux-revise
    agent: designer
    tools: [file_write, file_read]
    depends_on: [component-specs]
    input:
      task: |
        Read docs/23-uiux-review.md if exists.
        Apply requested fixes to docs/20~22 when review exists.
        Write docs/23a-uiux-revision-log.md.

  - name: uiux-review
    pattern: peer-review
    tools: [file_write, file_read, review]
    depends_on: [uiux-revise]
    participants: [reviewer-1]
    config:
      min_score: 7
      p0_allowed: 0
      max_rounds: 1
      consensus:
        rule: majority
        min_votes: 1
        timeout: 300
    input:
      task: |
        Review docs/20~22 and docs/23a.
        Write docs/23-uiux-review.md with PASS/FAIL and actions.
        APPROVE only when no unresolved P0/P1.
    on_fail:
      goto: uiux-revise
      max_iterations: 3
      escalate_on_exhaust: fail
