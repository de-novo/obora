# obora-kit global config example (TASK-053 style)
# Place this at ~/.obora/config.yaml for user-level defaults.

defaults:
  provider: anthropic
  model: claude-opus-4-6
  temperature: 0.2
  timeout: 180
  maxTokens: 8192

providers:
  anthropic:
    # token auth (placeholder reference)
    authMode: token
    authRef: env:ANTHROPIC_API_KEY
    defaultModel: claude-opus-4-6
    timeout: 180
    maxTokens: 8192

  zai:
    # api_key auth (placeholder reference)
    authMode: api_key
    authRef: env:ZAI_API_KEY
    defaultModel: glm-4.7
    timeout: 120
    maxTokens: 8192

  openai-codex:
    # oauth auth (placeholder reference)
    authMode: oauth
    authRef: obora-auth:openai-codex
    defaultModel: gpt-5.3-codex
    timeout: 300
    maxTokens: 16384

agents:
  # Workflow role mapping
  planner:
    provider: anthropic
    model: claude-opus-4-6
    temperature: 0.1

  architect:
    provider: anthropic
    model: claude-opus-4-5
    temperature: 0.1

  developer:
    provider: openai-codex
    model: gpt-5.3-codex
    temperature: 0.2

  reviewer:
    # Primary/default reviewer model used when a single model is required
    provider: anthropic
    model: claude-opus-4-6
    temperature: 0.0
    # Multi-model review gate (run reviews across all models)
    reviewModels:
      - name: opus
        provider: anthropic
        model: claude-opus-4-6
      - name: codex
        provider: openai-codex
        model: gpt-5.3-codex
      - name: glm-4.7
        provider: zai
        model: glm-4.7
      - name: glm-5
        provider: zai
        model: glm-5
