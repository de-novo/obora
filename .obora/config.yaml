# obora-kit project config template
# This file is merged with ~/.obora/config.yaml by AgentConfigResolver.

defaults:
  temperature: 0.2
  timeout: 300
  maxTokens: 8192

agents:
  planner:
    provider: openrouter
    model: openrouter/owl-alpha
    temperature: 0.1

  architect:
    provider: openrouter
    model: openrouter/owl-alpha
    temperature: 0.1

  developer:
    provider: openrouter
    model: openrouter/owl-alpha
    temperature: 0.2

  reviewer:
    provider: openrouter
    model: openrouter/owl-alpha
    temperature: 0.0
    reviewModels:
      - name: owl-alpha
        provider: openrouter
        model: openrouter/owl-alpha
