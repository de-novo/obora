name: chat-develop
version: "1.1"
description: "Implement repository changes from an Obora chat request"

steps:
  - name: implement-chat-request
    agent: developer
    description: "Turn the operator chat request into concrete files."
    input:
      task: |
        Treat the Run input JSON as the operator chat request. Implement the requested development task in this repository using structured file_write tool calls.

        Choose a focused example directory under examples/ that matches the request, and create all files needed to run it locally. Prefer dependency-free Node.js or browser-native implementations unless the request explicitly asks for a framework.

        For a todo app request, create a complete standalone browser app under examples/chat-todo-app with:
        - package.json
        - server.mjs
        - index.html
        - src/main.js
        - src/styles.css
        - README.md

        The todo app should support adding, completing, editing, deleting, filtering, clearing completed items, counts, and localStorage persistence. Include accessible labels, keyboard-friendly controls, and concise run instructions.
        Keep outputs concise, verifiable, and directly runnable with npm scripts.
    config:
      maxToolRounds: 18
