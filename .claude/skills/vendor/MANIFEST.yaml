# 변경 대응 가이드:
#
# 업데이트 시:
#   1. source_url에서 최신 버전 확인
#   2. 스킬 파일 업데이트 (덮어쓰기 가능)
#   3. version, synced_at 필드 갱신
#
# Deprecated 시:
#   1. deprecated: true 필드 추가
#   2. alternative: "대안 스킬" 필드 추가
#   3. 의존하는 워크플로우 확인
#
# 삭제 시:
#   1. 로컬 보존 여부 결정
#   2. removed: true 필드 추가 또는 항목 삭제
#   3. 의존하는 워크플로우에서 제거
