version: "1.0"
tools:
  - name: shell_exec
    effect: deny
    when:
      matches: ["sudo", "rm -rf"]
  - name: file_write
    effect: allow
sandbox:
  root: ./output
  deny_outside_root: true
resources:
  timeout_ms: 300000
  max_tokens: 100000
gates:
  - step: deploy
    type: human-approval
    required: true
    timeout: 24h
    fallback: escalate
