<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obora Dashboard</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; background: #111; color: #eee; }
      h1 { margin-top: 0; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
      .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 1rem; }
      .status { font-weight: 700; }
      .muted { color: #aaa; font-size: 0.9rem; }
      pre { background: #171717; border: 1px solid #333; border-radius: 8px; padding: 0.75rem; overflow: auto; }
    </style>
    <script type="module" src="https://unpkg.com/@mariozechner/pi-web-ui@0.52.12/dist/pi-web-ui.js"></script>
  </head>
  <body>
    <h1>Obora Dashboard</h1>
    <p class="muted">Feature status + realtime workflow events</p>

    <div id="features" class="grid"></div>

    <h2>Realtime events</h2>
    <pre id="events"></pre>

    <script>
      const featuresEl = document.getElementById('features');
      const eventsEl = document.getElementById('events');

      async function loadFeatures() {
        const res = await fetch('/api/features');
        const data = await res.json();
        featuresEl.innerHTML = data.features.map((f) => `
          <div class="card">
            <div><strong>${f.name}</strong> <span class="status">${f.status}</span></div>
            <div class="muted">workflow: ${f.workflow}</div>
            <div class="muted">stage: ${f.currentStage ?? '-'}</div>
            <div class="muted">updated: ${f.updatedAt ?? '-'}</div>
          </div>
        `).join('');
      }

      function connectWs() {
        const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);

        ws.onmessage = (message) => {
          const line = JSON.stringify(JSON.parse(message.data), null, 2);
          eventsEl.textContent = `${line}\n\n${eventsEl.textContent}`.slice(0, 20000);
          loadFeatures().catch(() => {});
        };

        ws.onclose = () => {
          setTimeout(connectWs, 1000);
        };
      }

      loadFeatures();
      connectWs();
    </script>
  </body>
</html>
