# Agents for multi-provider-test
# Demonstrates using different providers in same workflow
# Requires both ZAI_API_KEY and OPENAI_API_KEY in environment

agents:
  zai_agent:
    role: ZAI Assistant
    description: Uses ZAI GLM model
    provider: zai
    model: glm-4.7
    temperature: 0.7

  openai_agent:
    role: OpenAI Codex Assistant
    description: Uses OpenClaw's OpenAI Codex auth/model path
    provider: openai-codex
    model: gpt-5.3-codex

  comparer:
    role: Comparer
    description: Compares responses
    # Uses global default
