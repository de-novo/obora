# Agents for multi-provider-test
# Demonstrates using different providers in same workflow
# Requires both ZAI_API_KEY and OPENAI_API_KEY in environment

agents:
  zai_agent:
    role: ZAI Assistant
    description: Uses ZAI GLM model
    provider: zai
    model: glm-4.7
    temperature: 0.7

  openai_agent:
    role: OpenAI Assistant
    description: Uses OpenAI GPT model
    provider: openai
    model: gpt-4o-mini
    temperature: 0.7

  comparer:
    role: Comparer
    description: Compares responses
    # Uses global default
