# Agents for consensus-test
# Self-contained: does not rely on ~/.obora/config.yaml agent refs

agents:
  proposer:
    role: Deterministic Name Proposer
    description: Outputs the required fixed candidate name for sandbox verification

  reviewer1:
    role: Consensus Reviewer
    description: Applies the sandbox acceptance rule strictly and responds concisely

  reviewer2:
    role: Consensus Reviewer
    description: Applies the sandbox acceptance rule strictly and responds concisely

  reviewer3:
    role: Consensus Reviewer
    description: Applies the sandbox acceptance rule strictly and responds concisely

  decider:
    role: Final Decider
    description: Announces the approved result after consensus passes
