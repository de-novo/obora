# Agents for consensus-test
# Uses global config defaults (~/.obora/config.yaml)
# Also uses pre-defined reviewer agents from global config

agents:
  proposer:
    role: Name Proposer
    description: Proposes creative names
    temperature: 0.8

  # Uses reviewers from global config
  reviewer1:
    ref: reviewer-1

  reviewer2:
    ref: reviewer-2

  reviewer3:
    ref: reviewer-3

  decider:
    role: Final Decider
    description: Makes final announcements
