# Test Case 04: Consensus
# 다중 에이전트 투표/합의 패턴 테스트

name: consensus-test
version: "1.0"

steps:
  - name: propose
    agent: proposer
    input:
      task: |
        Propose a name for a new AI assistant.
        Output only the name, nothing else.

  - name: vote
    pattern: consensus
    depends_on: [propose]
    participants: [reviewer1, reviewer2, reviewer3]
    rule: majority
    input:
      proposal: "{{propose}}"
      task: |
        Review this proposed AI assistant name: {{propose}}

        Vote APPROVE if you think it's good.
        Vote REJECT if you think it's bad.
        Vote REQUEST_CHANGES if you have suggestions.

        Provide a brief reason for your vote.

  - name: decide
    agent: decider
    depends_on: [vote]
    input:
      task: |
        The consensus result was: {{vote}}

        If approved, announce the final name.
        If rejected, propose a new name.
