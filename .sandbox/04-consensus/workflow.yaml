# Test Case 04: Consensus
# Deterministic consensus pattern test

name: consensus-test
version: "1.0"

steps:
  - name: propose
    agent: proposer
    input:
      task: |
        Output exactly this AI assistant name and nothing else:
        Aether

  - name: vote
    pattern: consensus
    depends_on: [propose]
    participants: [reviewer1, reviewer2, reviewer3]
    rule: majority
    input:
      proposal: "{{propose}}"
      task: |
        Validate this proposed AI assistant name: {{propose}}

        Sandbox acceptance rule:
        - APPROVE only if the proposal is exactly "Aether"
        - REJECT otherwise
        - Start your response with APPROVE or REJECT
        - Then give one short reason

  - name: decide
    agent: decider
    depends_on: [vote]
    input:
      task: |
        The consensus result was: {{vote}}

        Announce the final approved name in one short sentence.
