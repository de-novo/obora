# Test Case 07: Custom Tools
# Runnable custom tool injection test

name: custom-tools-test
version: "1.0"

steps:
  - name: use_custom_tool
    agent: tool_user
    input:
      task: |
        You MUST call the `calculate` tool exactly once with expression `42 * 17`.
        Do not compute mentally.
        After the tool returns, output only: 714

  - name: verify_result
    agent: verifier
    depends_on: [use_custom_tool]
    input:
      task: |
        Verify the previous step result.
        Expected value: 714
        If it matches, reply exactly: VERIFIED: 714
        Otherwise reply exactly: FAILED
