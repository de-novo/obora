# Test Case 07: Custom Tools
# 커스텀 도구 주입 테스트

name: custom-tools-test
version: "1.0"

steps:
  - name: use_custom_tool
    agent: tool_user
    input:
      task: |
        Use the 'calculate' tool to compute 42 * 17.
        Then output the result.

  - name: verify_result
    agent: verifier
    depends_on: [use_custom_tool]
    input:
      task: |
        Verify the calculation result from the previous step.
        The correct answer is 714.
        Confirm if the result matches.
